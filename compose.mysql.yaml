services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: mmg
      MYSQL_USER: mmg
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?set MYSQL_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysqladmin ping -h 127.0.0.1 -u mmg --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: production
    command: ["mcp-manager", "upgrade"]
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MCP_MANAGER_HOME: /data
      DATABASE_URL: "mysql://mmg:${MYSQL_PASSWORD}@mysql:3306/mmg?charset=utf8mb4"
      PUBLIC_URL: "${PUBLIC_URL:-http://127.0.0.1:8765}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
    volumes:
      - mcp-manager-data:/data
    restart: "no"

  gateway:
    build:
      context: .
      target: production
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      MCP_MANAGER_HOME: /data
      DATABASE_URL: "mysql://mmg:${MYSQL_PASSWORD}@mysql:3306/mmg?charset=utf8mb4"
      PUBLIC_URL: "${PUBLIC_URL:-http://127.0.0.1:8765}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
    volumes:
      - mcp-manager-data:/data
    healthcheck:
      test:
        - CMD
        - /opt/venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/readyz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    init: true
    stop_grace_period: 45s

volumes:
  mysql-data:
  mcp-manager-data:
