services:
  migrate:
    build:
      context: .
      target: production
    command: ["mcp-manager", "upgrade"]
    environment:
      MCP_MANAGER_HOME: /data
      PUBLIC_URL: "${PUBLIC_URL:-http://127.0.0.1:8765}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
    volumes:
      - mcp-manager-data:/data
    restart: "no"

  gateway:
    build:
      context: .
      target: production
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      MCP_MANAGER_HOME: /data
      PUBLIC_URL: "${PUBLIC_URL:-http://127.0.0.1:8765}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
    volumes:
      - mcp-manager-data:/data
    healthcheck:
      test:
        - CMD
        - /opt/venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/readyz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    init: true
    stop_grace_period: 45s

volumes:
  mcp-manager-data:
