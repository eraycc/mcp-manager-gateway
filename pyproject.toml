[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-manager-gateway"
version = "1.4.7"
requires-python = ">=3.12"
description = "Multi-user MCP management and lazy proxy gateway that makes MCP work like Skills: progressive capability discovery, on-demand server startup, and one stable gateway for every agent."
license = { file = "LICENSE" }
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["mcp", "model-context-protocol", "mcp-gateway", "mcp-proxy", "mcp-manager", "gateway", "proxy", "lazy-loading", "lazy-start", "lifecycle-management", "mcp-lifecycle", "progressive-disclosure", "agent-tools"]
authors = [
    { name = "Eray", email = "admin@eray.cc" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.34",
  "sqlalchemy[asyncio]>=2.0", "aiosqlite>=0.21", "asyncmy>=0.2",
  "alembic>=1.15", "pydantic-settings>=2.8", "httpx>=0.28",
  "mcp>=2.2,<3", "PyJWT>=2.10", "argon2-cffi>=23.1",
  "cryptography>=44", "jsonschema>=4.23", "referencing>=0.28.4", "apscheduler>=3.11,<4",
  "filelock>=3.17", "python-multipart>=0.0.20", "pyyaml>=6.0.3",
  "pywin32>=308; sys_platform == 'win32'"
]

[project.scripts]
mcp-manager = "mcp_manager.cli:main"
mcp-manager-gateway = "mcp_manager.cli:main"
mmg = "mcp_manager.cli:main"

[project.urls]
Homepage = "https://github.com/eraycc/mcp-manager-gateway"
Documentation = "https://github.com/eraycc/mcp-manager-gateway/blob/master/wiki/README.md"
Repository = "https://github.com/eraycc/mcp-manager-gateway"
Issues = "https://github.com/eraycc/mcp-manager-gateway/issues"
Changelog = "https://github.com/eraycc/mcp-manager-gateway/releases"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "playwright>=1.50",
    "pytest-xdist>=3.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_manager"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/README.zh-CN.md", "/pyproject.toml", "/uv.lock", "/.env.example", "/Dockerfile", "/compose.yaml", "/compose.mysql.yaml", "/alembic.ini", "/deploy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 110
